<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সহজ কাউন্টার অ্যাপ</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .count {
      font-size: 72px;
      font-weight: bold;
      margin: 20px 0;
      color: #38bdf8;
    }
    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .add { background: #22c55e; color: #052e16; font-weight: bold; }
    .reset { background: #334155; color: #f8fafc; }
  </style>
</head>
<body>
  <h2>আমার প্রথম অ্যাপ</h2>
  <div class="count" id="num">0</div>
  <div>
    <button class="add" onclick="change(1)">+১ বাড়ান</button>
    <button class="reset" onclick="change(0)">রিসেট</button>
  </div>

  <script>
    let count = 0;
    function change(val) {
      count = val === 0 ? 0 : count + val;
      document.getElementById("num").innerText = count;
    }
  </script>
</body>
</html>
